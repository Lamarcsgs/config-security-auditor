# Configuración de prueba FortiOS
config system global
    set hostname "FW-Principal"
    set admin-sport 443
end

config system interface
    edit "port1"
        set mode static
        set ip 192.168.1.99 255.255.255.0
        set allowaccess ping https ssh http telnet
    next
end

config firewall policy
    edit 1
        set name "Permitir-Todo-Outbound"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end